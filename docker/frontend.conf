map $uri $cache_policy {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
}
server {
    listen 8501;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 55m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $cache_policy always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; font-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 4200s;
        # Forward incremental Agent SSE chunks without accumulating a response.
        proxy_buffering off;
        proxy_cache off;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
