name: talent-discovery
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        WITH_VECTORS: ${WITH_VECTORS:-false}
    env_file: .env
    environment:
      DATA_DIR: /srv/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - talent_data:/srv/data
    cpus: 3.0
    mem_limit: 6g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8501/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
volumes:
  talent_data:
